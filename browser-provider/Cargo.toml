[package]
name = "cmux-browser-provider"
version = "0.1.0"
edition = "2024"
description = "Linux browser provider for cmux browser tabs (runs a headless Chromium-family browser)"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "cmux_browser_provider"
path = "src/lib.rs"

[[bin]]
name = "cmux-browser-provider"
path = "src/main.rs"

[dependencies]
# Upstream's Rust SDK, from the pinned source checkout (scripts/20-fetch-source.sh).
cmux-sdk = { path = "../build/cmux/cmux-tui/bindings/rust" }
serde_json = "1"
libc = "0.2"
# DevTools WebSocket client for reading a page's selection (no TLS: loopback only).
tungstenite = "0.30"
# Cookie import from the person's other browsers: their SQLite cookie
# stores, and Chromium's AES-128-CBC cookie encryption (PBKDF2-SHA1 key).
rusqlite = { version = "0.37", features = ["bundled"] }
aes = "0.8"
cbc = "0.1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"

# Standalone: not part of upstream's cargo workspace.
[workspace]
